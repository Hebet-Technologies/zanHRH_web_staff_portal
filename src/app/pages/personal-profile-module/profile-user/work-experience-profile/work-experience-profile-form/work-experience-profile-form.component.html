<div class="modal-header bg-light p-3">
    <h5 class="modal-title" id="exampleModalLabel">Add Work Experience</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="closeModal()"></button>
</div>
<form (ngSubmit)="saveWorkExperience()" [formGroup]="workExperienceForm" class="tablelist-form" autocomplete="off">
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-lg-6">
                <div>
                    <label for="form-field" class="form-label">Institute <span class="text-danger">*</span></label>
                    <input type="text" id="form-field" class="form-control"  placeholder="Enter Institute" required formControlName="instituteName" 
                    [ngClass]="{ 'is-invalid': submitted && form['instituteName'].errors }" />
                    <div *ngIf="submitted && form['instituteName'].errors" class="invalid-feedback" align="left">
                        <div *ngIf="form['instituteName'].errors['required']">Institute Name is required</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div>
                    <label for="form-field" class="form-label">Position <span class="text-danger">*</span></label>
                    <input type="text" id="form-field" class="form-control"  placeholder="Enter Position" required formControlName="positionName" 
                    [ngClass]="{ 'is-invalid': submitted && form['positionName'].errors }" />
                    <div *ngIf="submitted && form['positionName'].errors" class="invalid-feedback" align="left">
                        <div *ngIf="form['positionName'].errors['required']">Position Name is required</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div>
                    <label for="date-field" class="form-label">Start Date  <span class="text-danger">*</span></label>
                    <input
                    class="form-control flatpickr-input"
                    type="text"
                    placeholder="Select Date"
                    mwlFlatpickr
                    [altInput]="true"
                    [enableTime]="true"
                    [convertModelValue]="true"
                    [dateFormat]="'Y-m-d H:i'"
                    [maxDate]="maxDate"
                    formControlName="startDate"
                    [ngClass]="{ 'is-invalid': submitted && form['startDate'].errors }"
                    >
                    <div *ngIf="submitted && form['startDate'].errors" class="invalid-feedback" align="left">
                        <div *ngIf="form['startDate'].errors['required']">Start Date is required</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div>
                    <label for="date-field" class="form-label">End Date  <span class="text-danger">*</span></label>
                    <input
                    class="form-control flatpickr-input"
                    type="text"
                    placeholder="Select Date"
                    mwlFlatpickr
                    [altInput]="true"
                    [enableTime]="true"
                    [convertModelValue]="true"
                    [dateFormat]="'Y-m-d H:i'"
                    [minDate]="minEndDate ? minEndDate : maxDate"
                    [maxDate]="maxDate"
                    formControlName="endDate"
                    [ngClass]="{ 'is-invalid': submitted && form['endDate'].errors }"
                    >
                    <div *ngIf="submitted && form['endDate'].errors" class="invalid-feedback" align="left">
                        <div *ngIf="form['endDate'].errors['required']">End Date is required</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-12">
                <label for="formFile" class="form-label">Upload Attachement</label>
                <input
                    class="form-control"
                    type="file"
                    id="formFile"
                    (change)="onFileChange($event)"
                >
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="hstack gap-2 justify-content-end">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="closeModal()">Close</button>
        <button type="submit" class="btn btn-info" id="add-btn">Save Data</button>
        </div>
    </div>
</form>
