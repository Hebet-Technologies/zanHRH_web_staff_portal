<div class="modal-header bg-light p-3">
    <h5 class="modal-title" id="exampleModalLabel">Add Hobby</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="closeModal()"></button>
</div>
<form (ngSubmit)="saveHobbies()" [formGroup]="hobbiesForm" class="tablelist-form" autocomplete="off">
    <div class="modal-body">
        <div class="mb-3">
            <label for="field-data" class="form-label">Hobby / Interest <span class="text-danger">*</span></label>
            <ng-select [items]="hobbyList" 
                bindLabel="hobby_name" 
                bindValue="hobby_id" 
                placeholder="Select..." required 
                formControlName="hobbyID" 
                [ngClass]="{ 'is-invalid': submitted && form['hobbyID'].errors }">
            </ng-select>
            <div *ngIf="submitted && form['hobbyID'].errors" class="invalid-feedback" align="left">
                <div *ngIf="form['hobbyID'].errors['required']">Hobby / Interest is required</div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="hstack gap-2 justify-content-end">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="closeModal()">Close</button>
        <button type="submit" class="btn btn-info" id="add-btn">Save Data</button>
        </div>
    </div>
</form>
