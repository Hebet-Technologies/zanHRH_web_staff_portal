<app-breadcrumbs title="Knowledge Center" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">{{ isEdit ? 'Edit Announcement' : 'New Announcement' }}</h5>
      </div>
      <div class="card-body">
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Category <span class="text-danger">*</span></label>
            <select class="form-select" [(ngModel)]="selectedCategoryUuid" name="category" required>
              <option value="" disabled>Select a help desk category</option>
              <option *ngFor="let cat of categories" [value]="cat.uuid">{{ cat.name }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="title" name="title"
              placeholder="e.g. New VPN Setup Guide" maxlength="255" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description <span class="text-danger">*</span></label>
            <textarea class="form-control" [(ngModel)]="body" name="body" rows="8"
              placeholder="Write the update or announcement details..." required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Status</label>
            <div class="d-flex gap-2">
              <div *ngFor="let s of statuses">
                <input type="radio" class="btn-check" [id]="'status-' + s.value" [(ngModel)]="status"
                  name="status" [value]="s.value" [checked]="status === s.value">
                <label class="btn" [ngClass]="status === s.value ? (s.value === 'PUBLISHED' ? 'btn-success' : 'btn-warning') : 'btn-outline-secondary'"
                  [for]="'status-' + s.value">{{ s.label }}</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Attachments</label>
            <input type="file" class="form-control" (change)="onFileChange($event)" multiple
              accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.xls,.xlsx,.txt,.mp3,.wav,.ogg">
            <small class="text-muted">Images, documents, audio. Max 10MB each.</small>

            <div *ngIf="existingAttachments.length > 0" class="mt-2">
              <div *ngFor="let att of existingAttachments; let i = index" class="d-flex align-items-center gap-2 mb-1">
                <i class="ri-file-attachment-line text-muted"></i>
                <span class="text-muted">{{ att.original_file_name || att.name }}</span>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeExistingAttachment(i)">
                  <i class="ri-close-line"></i>
                </button>
              </div>
            </div>

            <div *ngIf="attachments.length > 0" class="mt-2">
              <div *ngFor="let file of attachments; let i = index" class="d-flex align-items-center gap-2 mb-1">
                <i class="ri-file-line text-muted"></i>
                <span class="text-muted">{{ file.name }}</span>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeAttachment(i)">
                  <i class="ri-close-line"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"
              [disabled]="isSubmitting || !selectedCategoryUuid || !title.trim() || !body.trim()">
              <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
              {{ isSubmitting ? 'Saving...' : (isEdit ? 'Update Announcement' : 'Publish Announcement') }}
            </button>
            <a routerLink="/app/knowledge-center/articles" class="btn btn-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
