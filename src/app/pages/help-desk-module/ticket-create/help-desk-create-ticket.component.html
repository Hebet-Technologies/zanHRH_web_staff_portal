<app-breadcrumbs title="Help Desk" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Create New Ticket</h5>
      </div>
      <div class="card-body">
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Category <span class="text-danger">*</span></label>
            <select class="form-select" [(ngModel)]="selectedCategoryUuid" name="category" required>
              <option value="" disabled>Select a category</option>
              <option *ngFor="let cat of categories" [value]="cat.uuid">{{ cat.name }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Subject</label>
            <input type="text" class="form-control" [(ngModel)]="subject" name="subject"
              placeholder="Brief summary of the issue" maxlength="255">
          </div>

          <div class="mb-3">
            <label class="form-label">Description <span class="text-danger">*</span></label>
            <textarea class="form-control" [(ngModel)]="content" name="content" rows="6"
              placeholder="Describe your issue in detail..." required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select" [(ngModel)]="priority" name="priority">
              <option *ngFor="let p of priorities" [value]="p.value">{{ p.label }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Attachments</label>
            <input type="file" class="form-control" (change)="onFileChange($event)" multiple
              accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.xls,.xlsx,.txt,.mp3,.wav,.ogg">
            <small class="text-muted">Images, documents, audio only. Max 10MB each.</small>
            <div *ngIf="attachments.length > 0" class="mt-2">
              <div *ngFor="let file of attachments; let i = index" class="d-flex align-items-center gap-2 mb-1">
                <span class="text-muted">{{ file.name }}</span>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeAttachment(i)">
                  <i class="ri-close-line"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || !selectedCategoryUuid || !content.trim()">
              <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
              {{ isSubmitting ? 'Submitting...' : 'Submit Ticket' }}
            </button>
            <a routerLink="/app/help-desk/tickets" class="btn btn-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
