
<div class="modal-header bg-light p-3">
    <h5 class="modal-title" id="exampleModalLabel">Add Leave Details</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="closeModal()"></button>
</div>
<form (ngSubmit)="saveLeaveRequest()" [formGroup]="leaveRequestForm" class="tablelist-form" autocomplete="off">
    <div class="modal-body">

        <div class="row g-3">
        <div class="col-lg-6">
            <div>
            <label for="field-data" class="form-label">Leave Type <span class="text-danger">*</span></label>
            <ng-select [items]="leaveStatusRequestOptions" 
                bindLabel="employement_status_name" 
                bindValue="employement_status_id" 
                placeholder="Select..." required 
                formControlName="employementStatusID" 
                [ngClass]="{ 'is-invalid': submitted && form['employementStatusID'].errors }">
            </ng-select>
            <div *ngIf="submitted && form['employementStatusID'].errors" class="invalid-feedback" align="left">
                <div *ngIf="form['employementStatusID'].errors['required']">Leave Type is required</div>
            </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div>
                <label for="date-field" class="form-label">Proposed Start  <span class="text-danger">*</span></label>
                <input
                class="form-control flatpickr-input"
                type="text"
                placeholder="Select Date"
                mwlFlatpickr
                [altInput]="true"
                [enableTime]="true"
                [convertModelValue]="true"
                [dateFormat]="'Y-m-d H:i'"
                [minDate]="'today'"
                formControlName="proposedStartDate"
                [ngClass]="{ 'is-invalid': submitted && form['proposedStartDate'].errors }"
                >
                <div *ngIf="submitted && form['proposedStartDate'].errors" class="invalid-feedback" align="left">
                    <div *ngIf="form['proposedStartDate'].errors['required']">Proposed Start Date is required</div>
                </div>
            </div>
        </div>
        <div class="col-lg-12" *ngIf="showUploadField">
            <div>
                <label for="formFile" class="form-label">Upload Reason <span class="text-danger">*</span></label>
                <input
                    class="form-control"
                    type="file"
                    id="formFile"
                    (change)="onFileChange($event)"
                    [ngClass]="{ 'is-invalid': submitted && form['uploadReason'].errors }"
                >
                <div *ngIf="submitted && form['uploadReason'].errors" class="invalid-feedback">
                    <div *ngIf="form['uploadReason'].errors['required']">Upload Reason is required</div>
                </div>
            </div>
        </div>
        <div [ngClass]="showNoDayField ? 'col-lg-6' : 'col-lg-12'">
            <div>
                <label for="phone-field" class="form-label">Contact on Leave <span class="text-danger">*</span></label>
                <input type="text" id="phone-field" class="form-control"  placeholder="Enter phone no" required formControlName="contactOnLeave" 
                [ngClass]="{ 'is-invalid': submitted && form['contactOnLeave'].errors }" />
                <div *ngIf="submitted && form['contactOnLeave'].errors" class="invalid-feedback" align="left">
                    <div *ngIf="form['contactOnLeave'].errors['required']">Contact on Leave is required</div>
                    <div *ngIf="form['contactOnLeave'].errors['pattern']">Invalid phone no format</div>

                </div>
            </div>
        </div>
        <div class="col-lg-6" *ngIf="showNoDayField">
            <div>
                <label for="phone-field" class="form-label">Number of Days <span class="text-danger">*</span></label>
                <input type="number" id="phone-field" class="form-control"  placeholder="Enter number of day" required formControlName="numberOfDays" 
                oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" 
                [ngClass]="{ 'is-invalid': submitted && form['numberOfDays'].errors }" />
                <div *ngIf="submitted && form['numberOfDays'].errors" class="invalid-feedback" align="left">
                    <div *ngIf="form['numberOfDays'].errors['required']">Number of Days is required</div>
                </div>
            </div>
        </div>
        <div class="col-lg-12" *ngIf="showRepresentativesField">
            <div>
            <label class="form-label">Representative <span class="text-danger">*</span></label>
            <ng-select
                [items]="representOptions"
                bindLabel="displayName"
                bindValue="personal_information_id"
                placeholder="Select..."
                formControlName="representativeID"
                [ngClass]="{ 'is-invalid': submitted && form['representativeID'].errors }">
            </ng-select>
            <div *ngIf="submitted && form['representativeID'].errors" class="invalid-feedback">
                <div *ngIf="form['representativeID'].errors['required']">
                Representative is required
                </div>
            </div>
            </div>
        </div>

        <div class="col-lg-12">
            <div>
            <label class="form-label">Are you going to travel outside of Tanzania<span class="text-danger">*</span></label>
            <div class="d-flex gap-3">
                <div class="form-check">
                <input class="form-check-input" type="radio" value="1" formControlName="travelOutsideCountry" id="travelYes"/>
                <label class="form-check-label" for="travelYes"> Yes </label>
                </div>

                <div class="form-check">
                <input class="form-check-input" type="radio" value="2" formControlName="travelOutsideCountry" id="travelNo"/>
                <label class="form-check-label" for="travelNo"> No </label>
                </div>
            </div>
            <div *ngIf="submitted && form['travelOutsideCountry'].errors" class="invalid-feedback d-block">
                <div *ngIf="form['travelOutsideCountry'].errors['required']">
                Please select an option
                </div>
            </div>
            </div>
        </div>
        <div class="col-lg-12" *ngIf="showPlaceToTravelField">
            <div>
            <label for="field-data" class="form-label">Wish To Travel To <span class="text-danger">*</span></label>
            <ng-select [items]="coutryOptions" 
                bindLabel="country_name" 
                bindValue="country_name" 
                placeholder="Select..." required 
                formControlName="placeToTravel" 
                [ngClass]="{ 'is-invalid': submitted && form['placeToTravel'].errors }">
            </ng-select>
            <div *ngIf="submitted && form['placeToTravel'].errors" class="invalid-feedback" align="left">
                <div *ngIf="form['placeToTravel'].errors['required']">Wish To Travel is required</div>
            </div>
            </div>
        </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="hstack gap-2 justify-content-end">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" (click)="closeModal()">Close</button>
        <button type="submit" class="btn btn-info" id="add-btn">Save Data</button>
        </div>
    </div>
</form>
